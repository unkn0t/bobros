[package]
name = "bobros" 
version = "0.2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
bit_field = "0.10.2"
bitflags = "2.9.3"

[dependencies.spin]
version = "0.10"
default-features = false
features = ["mutex", "spin_mutex", "lazy"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
